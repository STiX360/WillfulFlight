Page: "Willful Flight"
Group: "Levitation"
Enabled: "Enable Willful Flight"
WillpowerWeight: "Willpower influence (%)"
SpeedWeight: "Speed influence (%)"
Multiplier: "Overall flight speed"
PageDescription: >-
  Choose how much Willpower and Speed affect your levitation. These percentages
  change how the attributes are used, not your final speed directly. To simply
  fly twice as fast, set Overall flight speed to 2. Settings are saved per character.
EnabledDescription: >-
  Makes your levitation speed depend on the settings below. Turn off to restore
  normal flight. Walking, running and NPCs are unaffected.
WillpowerWeightDescription: >-
  How strongly Willpower affects your flying speed. 100% uses your Willpower
  as-is, matching this mod's normal behaviour. 200% treats it as twice as high;
  1000% treats it as ten times as high. Higher values make you fly faster, but
  do not increase your actual Willpower. Fortify, Drain and Damage Willpower count.
  Range: 0-1000%; default: 100%.
SpeedWeightDescription: >-
  How strongly your Speed attribute also affects flying speed. 0% ignores Speed;
  100% uses it as-is. This is added alongside Willpower, so increasing both makes
  you faster. For vanilla flight, use Willpower 0%, Speed 100%, and Overall flight
  speed 1. Range: 0-1000%; default: 0%.
MultiplierDescription: >-
  Adjusts your flying speed after the settings above. 1 leaves it unchanged,
  0.5 means half speed, and 2 means double speed. Walking and running are
  unaffected. Range: 0.1-3; default: 1. Extreme settings can hit the mod's lift limit.
CalculationPage: "Willful Flight - Calculation"
CalculationDescription: |-
  Effective attribute = Willpower x (Willpower influence / 100) + Speed x (Speed influence / 100).

  Base flight speed = MinFlySpeed + ((Effective attribute + Levitate strength) / 100) x (MaxFlySpeed - MinFlySpeed).

  Target speed = max(0, Base flight speed x (1 - EncumberedMoveEffect x load)) x Overall flight speed.

  Willpower and Speed include bonuses, drains and damage. Load is carried weight divided by carrying capacity; over capacity means no movement. MinFlySpeed, MaxFlySpeed and EncumberedMoveEffect are the game's fMinFlySpeed, fMaxFlySpeed and fEncumberedMoveEffect settings.

  The two influences are added, not averaged. At 100% each, the effective attribute is Willpower + Speed. At Willpower 100% and Speed 0%, it is just Willpower. 1000% uses ten times that attribute, not necessarily ten times the final flight speed.

  This is the target for look-directed player flight. Extra helper lift is capped at 5000 points, so extreme targets may not be achievable. Dedicated jump-key ascent is excluded.
